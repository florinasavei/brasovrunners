name: docs-check

# Runs the same command the pre-commit hook runs, so local and CI cannot diverge.
# Read-only by design; see AGENTS.md §22 and SETUP.md §5.
# Pin every action to an immutable commit SHA per SETUP.md §5 before launch.

on:
  pull_request:
  push:
    branches: [qa, main]

permissions:
  contents: read

jobs:
  # The job name is the required status check in branch protection. Do not rename it.
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Corepack must be enabled before setup-node, or the yarn cache probe has no yarn.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      # --immutable fails if yarn.lock would change, so CI can never silently resolve
      # a different dependency tree than the one committed.
      - run: yarn install --immutable

      # Must stay `yarn check`: .githooks/pre-commit runs the same command, so the two
      # cannot diverge as `check` grows past docs:check (SETUP.md §8).
      # It needs no database: the tests run PostgreSQL in process via PGlite.
      - run: yarn check

      # Vercel builds serverless functions and never runs `yarn start`, so the portability
      # contract in BR-REQ-101-01 is exercised here or nowhere.
      - run: yarn build
      - name: Verify the app serves on PORT
        run: |
          PORT=3999 yarn start &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3999/ro; then
              echo "serves on PORT"; exit 0
            fi
            sleep 1
          done
          echo "did not serve on PORT within 30s"; exit 1

  # Separate job because it needs a real PostgreSQL and a browser, which `docs-check` must
  # not require — that one gates every commit and has to run on a bare machine.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: brasov_runners
          POSTGRES_USER: brasov_runners
          POSTGRES_PASSWORD: local_only_not_a_secret
        ports:
          - 5432:5432
        # Without this the first migration races the server's startup.
        options: >-
          --health-cmd "pg_isready -U brasov_runners -d brasov_runners"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://brasov_runners:local_only_not_a_secret@localhost:5432/brasov_runners
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable

      # Only Chromium, and only its dependencies: the full install pulls three browsers.
      - run: yarn playwright install --with-deps chromium

      - run: yarn db:migrate
      - run: yarn db:seed
      - run: yarn test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
