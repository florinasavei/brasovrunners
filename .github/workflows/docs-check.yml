name: docs-check

# Runs the same command the pre-commit hook runs, so local and CI cannot diverge.
# Read-only by design; see AGENTS.md §22 and SETUP.md §5.
# Pin every action to an immutable commit SHA per SETUP.md §5 before launch.

on:
  pull_request:
  push:
    branches: [qa, main]
  # By hand, to test a tree again even though a run already passed on it (§504).
  workflow_dispatch:
    inputs:
      full:
        description: Run everything, even if this exact tree already passed
        type: boolean
        default: true

permissions:
  contents: read
  # `tested-tree` reads the repository's artifact list and the run that uploaded one (§504).
  actions: read

# A pull request's new push makes its previous run moot: that run is cancelled rather than
# holding eight e2e runners for a verdict on code nobody will merge (§431).
# A push to `qa` or `main` is never cancelled — `yarn ship` waits on exactly that run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # **One tree, tested once (§504).** A release used to test the same files four times: the batch
  # pull request (its merge ref), the push to `qa` that merging it made, the `qa → main` release
  # pull request, and the push to `main` — about twelve minutes each, and `yarn ship` waited on
  # three of them in a row. The merge commit on `qa` has the same tree as the batch PR's merge
  # ref whenever `qa` did not move in between, and the release PR and `main` have `qa`'s tree,
  # because `main` only ever receives `qa`.
  #
  # So a run that passes everything records the tree it tested (`record-tested-tree`, below),
  # and this job asks first whether this exact tree was recorded. If it was, the heavy jobs are
  # skipped by their `if:` — and a job skipped by a condition reports "Success" to a required
  # check, while a skipped *workflow* would stay "Pending" for ever; that is why the whole
  # workflow always runs and only its jobs skip (GitHub's own words, "Handling skipped but required
  # checks": https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/troubleshooting-required-status-checks#handling-skipped-but-required-checks).
  # A different tree — `qa` moved, a conflict
  # resolved, one byte anywhere, this file included — finds no record and runs everything.
  #
  # A record counts only when its run is this workflow, on a branch of this repository: a pull
  # request from a fork runs its own copy of this file and could upload any name it likes.
  # A branch of this repository also runs its own copy, and could record a tree it never tested;
  # that is trusted because pushing a branch here already needs write access, which could change
  # this file on `qa` anyway. This check keeps strangers out; it does not police collaborators.
  # A record is trusted for twenty-four hours at most: the end-to-end seed builds its events
  # relative to today, so a tree tested days ago has not been tested against today's dates. A
  # release ships a tree tested the same day; an older one is tested again.
  # Anything that goes wrong here answers "not tested", so the failure mode is a full run — and
  # `continue-on-error` keeps a failure of this job (checkout, a runner) from turning an
  # otherwise green run red, which would stop `yarn ship` on a tree that passed.
  tested-tree:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      tested: ${{ steps.tree.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
      - name: Has this tree already passed?
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "tree $tree"
          if [ "$FULL" = "true" ]; then
            echo "tested=false" >> "$GITHUB_OUTPUT"; echo "asked to run everything"; exit 0
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tested-tree-$tree&per_page=30" \
            --jq '.artifacts[] | select(.expired == false and (.created_at | fromdateiso8601) > (now - 86400) and .workflow_run.id != null and .workflow_run.repository_id != null and .workflow_run.head_repository_id == .workflow_run.repository_id) | .workflow_run.id' \
            2>/dev/null) || runs=""
          for id in $runs; do
            path=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" \
              --jq 'select(.head_repository.id == .repository.id) | .path' 2>/dev/null) || continue
            case "$path" in
              .github/workflows/docs-check.yml|.github/workflows/docs-check.yml@*)
                echo "tested=true" >> "$GITHUB_OUTPUT"
                echo "::notice::this tree passed docs-check and every e2e shard in run $id; not testing it again"
                exit 0 ;;
            esac
          done
          echo "tested=false" >> "$GITHUB_OUTPUT"
          echo "no record of this tree: running everything"

  # The job name is the required status check in branch protection. Do not rename it.
  #
  # `!cancelled()` rather than the default `success()`: if `tested-tree` itself failed, this job
  # must run, not be skipped — a job skipped because its need failed also reads as passed.
  docs-check:
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    # About twelve minutes when well. A job with no ceiling waits GitHub's six hours; the V2.13
    # night lost an hour per shard to one hung spec before anybody saw it (§NNN).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Corepack must be enabled before setup-node, or the yarn cache probe has no yarn.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      # --immutable fails if yarn.lock would change, so CI can never silently resolve
      # a different dependency tree than the one committed.
      - run: yarn install --immutable

      # Must stay `yarn check`: .githooks/pre-commit runs the same command, so the two
      # cannot diverge as `check` grows past docs:check (SETUP.md §8).
      # It needs no database: the tests run PostgreSQL in process via PGlite.
      - run: yarn check

      # The build's own cache (§276): a Turbopack build that does not start from nothing. It
      # used to carry the fonts too, while `next/font/google` downloaded them at build time and
      # a runner that could not reach Google failed with "cannot resolve
      # @vercel/turbopack-next/internal/font/google/font". Every face is a file in
      # `src/theme/fonts/` since §460, so the build makes no request to Google at all.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
            next-${{ runner.os }}-

      # Vercel builds serverless functions and never runs `yarn start`, so the portability
      # contract in BR-REQ-101-01 is exercised here or nowhere.
      #
      # Twice before failing: the one failure this had was a fetch to Google's font service,
      # gone since the fonts live in the repository (§460). The retry stays as cheap insurance —
      # a release held up by somebody else's bad minute is worse than a minute spent retrying.
      - name: Build
        run: yarn build || (echo "::warning::the build failed once; retrying" && yarn build)
      - name: Verify the app serves on PORT
        run: |
          PORT=3999 yarn start &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3999/ro; then
              echo "serves on PORT"; exit 0
            fi
            sleep 1
          done
          echo "did not serve on PORT within 30s"; exit 1

  # Separate job because it needs a real PostgreSQL and a browser, which `docs-check` must
  # not require — that one gates every commit and has to run on a bare machine.
  #
  # **Sharded (§431), eight on every run, both projects (§504).** §209 ran the desktop project
  # alone on a pull request and both on a push, and §431 split that into four and eight shards.
  # Now the pull request is the one run that tests a tree — the push to `qa`, the release PR and
  # the push to `main` find it recorded and skip — so it runs the whole suite, both viewports,
  # on eight runners: about seven minutes each, under the `docs-check` job's own twelve, so the
  # pull request waits no longer than it did for the desktop half.
  #
  # §212 and §276 refused parallel specs because they share ONE database and ONE seeded event.
  # A shard is not a second worker on that database: each is its own machine with its own
  # PostgreSQL service, migrated and seeded from nothing, and inside it the specs still run one
  # at a time (`workers: 1` in CI). What two specs could interleave on before, they still cannot.
  e2e-shard:
    name: e2e ${{ matrix.shard }}/8
    needs: tested-tree
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    # About seven minutes a shard, build included. The ceiling turns a hang — V2.13's Turnstile spec
    # waited out 90-second timeouts for an hour per shard — into a red check within half an hour.
    timeout-minutes: 30
    strategy:
      # Every shard reports: one red shard should not hide what the others would have found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: brasov_runners
          POSTGRES_USER: brasov_runners
          POSTGRES_PASSWORD: local_only_not_a_secret
        ports:
          - 5432:5432
        # Without this the first migration races the server's startup.
        options: >-
          --health-cmd "pg_isready -U brasov_runners -d brasov_runners"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://brasov_runners:local_only_not_a_secret@localhost:5432/brasov_runners
      SHARD_TOTAL: 8
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable

      # Chromium is about 170 MB and the same bytes every run (§276): cached on the resolved
      # Playwright version, so it is downloaded when the dependency changes and not before.
      # The system libraries still install — they are apt packages, not a download we own.
      - name: Playwright's version, for the cache key
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Only Chromium, and only its dependencies: the full install pulls three browsers.
      - run: yarn playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: yarn playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - run: yarn db:migrate

      # The one suite that cannot run in the `docs-check` job: it needs two real connections,
      # and PGlite has one (BR-REQ-051-01 criterion 5). Once per run, not once per shard: the
      # first shard carries it, seconds long.
      - run: yarn test:concurrency
        if: matrix.shard == 1

      # The same build cache as above: the suite's `webServer` runs `yarn build` before the
      # first spec, and it is the slowest minute of this job.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            next-e2e-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
            next-e2e-${{ runner.os }}-

      - run: yarn db:seed

      # Both projects, desktop and the 320-pixel phone, on every run (§504, replacing §209's
      # desktop-only pull request): the run that tests a tree is the only one, so it tests all of it.
      #
      # `--shard=i/n` takes the i-th of n equal slices of the tests (`fullyParallel` makes the
      # slice per test, not per file; a `describe.serial` group stays in one slice). The union
      # of the shards is exactly the suite `yarn test:e2e` runs locally. Nothing is skipped.
      - name: End-to-end, shard ${{ matrix.shard }} of 8, both projects
        run: yarn test:e2e --shard=${{ matrix.shard }}/$SHARD_TOTAL

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          # One artifact per shard: the names must differ, or the second upload is refused.
          name: playwright-report-${{ matrix.shard }}
          # The report, and the traces of the retried tests (`trace: on-first-retry`).
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The shards' verdict as one check named `e2e`, as it was before sharding — what a reader of
  # the pull request, `yarn ship` and any branch-protection rule see does not depend on the
  # number of shards. `always()` so a red shard makes this red rather than skipped: a skipped
  # check reads as passed. Green without shards only when `tested-tree` found this tree passed.
  e2e:
    needs: [tested-tree, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed, or this tree already had
        run: |
          echo "tested before: ${{ needs.tested-tree.outputs.tested }}; shards: ${{ needs.e2e-shard.result }}"
          test "${{ needs.tested-tree.outputs.tested }}" = "true" || test "${{ needs.e2e-shard.result }}" = "success"

  # The record `tested-tree` reads (§504): a one-line artifact named after the tree, uploaded only
  # when `yarn check`, the build and every shard — both projects, and the concurrency suite on
  # shard 1 — passed on it. A failed upload is not a failed run: the next run of the same tree
  # simply tests it again.
  record-tested-tree:
    needs: [tested-tree, docs-check, e2e-shard]
    if: ${{ always() && needs.tested-tree.outputs.tree != '' && needs.docs-check.result == 'success' && needs.e2e-shard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "tree ${{ needs.tested-tree.outputs.tree }} passed in run ${{ github.run_id }} (${{ github.event_name }} ${{ github.sha }})" > tested-tree.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tested-tree-${{ needs.tested-tree.outputs.tree }}
          path: tested-tree.txt
          # The shortest GitHub keeps an artifact; `tested-tree` trusts it 24 hours by `created_at`.
          retention-days: 1
          overwrite: true
