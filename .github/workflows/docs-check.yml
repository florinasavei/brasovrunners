name: docs-check

# Runs the same command the pre-commit hook runs, so local and CI cannot diverge.
# Read-only by design; see AGENTS.md §22 and SETUP.md §5.
# Pin every action to an immutable commit SHA per SETUP.md §5 before launch.

on:
  pull_request:
  push:
    branches: [qa, main]

permissions:
  contents: read

# A pull request's new push makes its previous run moot: that run is cancelled rather than
# holding four e2e runners for twenty minutes of a verdict on code nobody will merge (§NNN).
# A push to `qa` or `main` is never cancelled — `yarn ship` waits on exactly that run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name is the required status check in branch protection. Do not rename it.
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Corepack must be enabled before setup-node, or the yarn cache probe has no yarn.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      # --immutable fails if yarn.lock would change, so CI can never silently resolve
      # a different dependency tree than the one committed.
      - run: yarn install --immutable

      # Must stay `yarn check`: .githooks/pre-commit runs the same command, so the two
      # cannot diverge as `check` grows past docs:check (SETUP.md §8).
      # It needs no database: the tests run PostgreSQL in process via PGlite.
      - run: yarn check

      # The build's own cache (§276). Two things come out of it: a Turbopack build that does
      # not start from nothing, and the fonts. `next/font/google` downloads its files at build
      # time, and on 2026-09-22 a runner could not reach Google — twenty-one identical "cannot
      # resolve @vercel/turbopack-next/internal/font/google/font" errors, a red pull request and
      # nothing wrong with the code. A warm cache skips that request entirely.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
            next-${{ runner.os }}-

      # Vercel builds serverless functions and never runs `yarn start`, so the portability
      # contract in BR-REQ-101-01 is exercised here or nowhere.
      #
      # Twice before failing: the one failure this has ever had is a fetch to Google's font
      # service, which either works on the second attempt or is a real outage, and a release
      # held up by somebody else's bad minute is worse than a minute spent retrying.
      - name: Build
        run: yarn build || (echo "::warning::the build failed once; retrying" && yarn build)
      - name: Verify the app serves on PORT
        run: |
          PORT=3999 yarn start &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3999/ro; then
              echo "serves on PORT"; exit 0
            fi
            sleep 1
          done
          echo "did not serve on PORT within 30s"; exit 1

  # Separate job because it needs a real PostgreSQL and a browser, which `docs-check` must
  # not require — that one gates every commit and has to run on a bare machine.
  #
  # **Sharded (§NNN).** One serial runner took twenty-two minutes for the desktop project on a
  # pull request and forty-four for both on a push — and `yarn ship` waits on the push to `qa`
  # before it releases. The suite is now split with Playwright's own `--shard`: four runners on a
  # pull request (desktop, as §209 decided), eight on a push (both projects, twice the specs), so
  # every runner carries about the same five minutes of Playwright.
  #
  # §212 and §276 refused parallel specs because they share ONE database and ONE seeded event.
  # A shard is not a second worker on that database: each is its own machine with its own
  # PostgreSQL service, migrated and seeded from nothing, and inside it the specs still run one
  # at a time (`workers: 1` in CI). What two specs could interleave on before, they still cannot.
  e2e-shard:
    name: e2e ${{ matrix.shard }}/${{ github.event_name == 'pull_request' && 4 || 8 }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports: one red shard should not hide what the others would have found.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1,2,3,4]' || '[1,2,3,4,5,6,7,8]') }}
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: brasov_runners
          POSTGRES_USER: brasov_runners
          POSTGRES_PASSWORD: local_only_not_a_secret
        ports:
          - 5432:5432
        # Without this the first migration races the server's startup.
        options: >-
          --health-cmd "pg_isready -U brasov_runners -d brasov_runners"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://brasov_runners:local_only_not_a_secret@localhost:5432/brasov_runners
      SHARD_TOTAL: ${{ github.event_name == 'pull_request' && 4 || 8 }}
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable

      # Chromium is about 170 MB and the same bytes every run (§276): cached on the resolved
      # Playwright version, so it is downloaded when the dependency changes and not before.
      # The system libraries still install — they are apt packages, not a download we own.
      - name: Playwright's version, for the cache key
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Only Chromium, and only its dependencies: the full install pulls three browsers.
      - run: yarn playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: yarn playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - run: yarn db:migrate

      # The one suite that cannot run in the `docs-check` job: it needs two real connections,
      # and PGlite has one (BR-REQ-051-01 criterion 5). Once per run, not once per shard: the
      # first shard carries it, seconds long.
      - run: yarn test:concurrency
        if: matrix.shard == 1

      # The same build cache as above: the suite's `webServer` runs `yarn build` before the
      # first spec, and it is the slowest minute of this job.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            next-e2e-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
            next-e2e-${{ runner.os }}-

      - run: yarn db:seed

      # A pull request runs the desktop project; a push to `qa` or `main` runs both (§209).
      #
      # The two projects are the same 163 specs at two viewports, so a pull request pays twice
      # for one set of behaviours — and the second pass is the one that catches least often,
      # because what differs at 320 pixels is layout, and layout is what the mobile project's
      # own assertions are about rather than a side effect of the others. The release is where
      # both run: a push to `qa` or `main` is not a moment anybody is waiting on.
      #
      # Nothing is skipped for ever and nothing is deleted: every spec still runs on every
      # release, and `yarn test:e2e` with no argument is still the whole suite locally.
      #
      # `--shard=i/n` takes the i-th of n equal slices of the tests (`fullyParallel` makes the
      # slice per test, not per file; a `describe.serial` group stays in one slice). The union
      # of the shards is exactly the suite the single job ran.
      - name: End-to-end, shard ${{ matrix.shard }} (desktop only on a pull request)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            yarn test:e2e --project=desktop --shard=${{ matrix.shard }}/$SHARD_TOTAL
          else
            yarn test:e2e --shard=${{ matrix.shard }}/$SHARD_TOTAL
          fi

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          # One artifact per shard: the names must differ, or the second upload is refused.
          name: playwright-report-${{ matrix.shard }}
          # The report, and the traces of the retried tests (`trace: on-first-retry`).
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The shards' verdict as one check named `e2e`, as it was before sharding — what a reader of
  # the pull request, `yarn ship` and any branch-protection rule see does not depend on the
  # number of shards. `always()` so a red shard makes this red rather than skipped: a skipped
  # check reads as passed.
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.e2e-shard.result }}"
          test "${{ needs.e2e-shard.result }}" = "success"
