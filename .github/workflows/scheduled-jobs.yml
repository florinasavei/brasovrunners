name: scheduled-jobs

# The external scheduler AGENTS.md §16.2 requires. Not a watchdog over an in-process
# interval — there is no in-process interval, because this application deploys to Vercel
# serverless functions, which have no persistent process for one to live in. This workflow
# is therefore the only thing that drains the email outbox and expires stale holds.
#
# GitHub Actions rather than Vercel Cron: the Hobby plan fires cron once per day, which is
# useless for a 30-minute declaration hold. Actions' own floor is five minutes, and its
# schedules are best-effort under load — acceptable precisely because §16.2 makes every job
# idempotent and evaluates expiry against `now` at read time, so a late run delays a
# notification rather than corrupting a queue.
#
# One environment per job matrix entry so a second Vercel project (production) is a row,
# not a copy of this file. Secrets are per environment in GitHub, mirroring how they are
# per project in Vercel: SETUP.md §3, `Brașov Runners / Scheduler QA`.

# The backstop, not the clock (CLAUDE.md § Stack): cron-job.org is the clock (SETUP.md §40). Since
# §577 a ping with nothing due answers from the cache and wakes no database, and an idle platform
# runs its jobs for real once a day at 04:00 in Brașov; so this runs four times a day, at 01:17,
# 07:17, 13:17 and 19:17 UTC — off the pinger's quarter-hours — to do what is due if the external
# pinger has stopped. It used to say every five minutes; GitHub ran it every three to five hours.
#
# It also WATCHES (§874). Every poke records a ping, and a recent ping reads as «ok» in the health
# answer, so the deep health is read FIRST, before the pokes: a dead pinger shows as a stale job or a
# stalled outbox there, and hides after them. Both pokes still run when it says something is wrong; the
# run turns red at its end (scripts/backstop-verdict.mjs, docs/RUNBOOKS.md § A red backstop run).
on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  # So a run can be forced while debugging without waiting for the next tick.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A slow run must not overlap the next tick. The endpoints are safe to retry, but two
  # concurrent claims of the same outbox batch is wasted work, not a useful one.
  group: scheduled-jobs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  poke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qa
            base_url_secret: QA_APP_BASE_URL
            job_secret: QA_JOB_SECRET
          # Skipped with a notice (production: a warning, it must be configured)
          # until both secrets exist — set them on deployment day, not before
          # (SETUP.md §26): a host that is not serving yet turns every run red.
          - name: production
            base_url_secret: PRODUCTION_APP_BASE_URL
            job_secret: PRODUCTION_JOB_SECRET
    steps:
      - uses: actions/checkout@v4

      - name: Health before the pokes
        # Read first, judged last. No --fail: a degraded answer is a 503 with a body, and the body is the point.
        env:
          BASE_URL: ${{ secrets[matrix.base_url_secret] }}
        run: |
          if [ -z "$BASE_URL" ]; then
            if [ "${{ matrix.name }}" = "production" ]; then
              echo "::warning::production is not configured: PRODUCTION_APP_BASE_URL is empty, so nothing watches production's jobs or database (SETUP.md §40 step 3)"
            else
              echo "::notice::${{ matrix.name }} is not configured; skipping"
            fi
            exit 0
          fi
          curl --silent --show-error --max-time 60 "$BASE_URL/api/health?deep=1" > "$RUNNER_TEMP/health.json" || echo "{}" > "$RUNNER_TEMP/health.json"

      - name: Email outbox
        if: always()
        env:
          BASE_URL: ${{ secrets[matrix.base_url_secret] }}
          JOB_SECRET: ${{ secrets[matrix.job_secret] }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$JOB_SECRET" ]; then
            if [ "${{ matrix.name }}" = "production" ]; then
              echo "::warning::production is not configured (${{ matrix.base_url_secret }} or ${{ matrix.job_secret }} is empty); skipping the outbox poke — production must be configured (SETUP.md §40 step 3)"
            else
              echo "::notice::${{ matrix.name }} is not configured; skipping"
            fi
            exit 0
          fi
          # --fail so a non-2xx is a failed run rather than a green tick over a 401.
          curl --fail --silent --show-error --max-time 60 \
            -X POST "$BASE_URL/api/internal/jobs/email-outbox" \
            -H "Authorization: Bearer $JOB_SECRET"

      - name: Registration maintenance
        # Runs even if the outbox call failed: expiring a hold and sending a message are
        # independent duties, and a stuck outbox must not also freeze the waiting list.
        if: always()
        env:
          BASE_URL: ${{ secrets[matrix.base_url_secret] }}
          JOB_SECRET: ${{ secrets[matrix.job_secret] }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$JOB_SECRET" ]; then
            if [ "${{ matrix.name }}" = "production" ]; then
              echo "::warning::production is not configured (${{ matrix.base_url_secret }} or ${{ matrix.job_secret }} is empty); skipping the maintenance poke — production must be configured (SETUP.md §40 step 3)"
            else
              echo "::notice::${{ matrix.name }} is not configured; skipping"
            fi
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -X POST "$BASE_URL/api/internal/jobs/registration-maintenance" \
            -H "Authorization: Bearer $JOB_SECRET"

      - name: Verdict (database, Neon budget, jobs, outbox)
        # The early health answer judged by scripts/backstop-verdict.mjs: the database that does not answer and a
        # red Neon budget (§868; red is 85 % by default, amber 60 % a warning) as before, and since §874 a stale job
        # or a stalled outbox — registration-maintenance excepted between 03:05 and 04:00 in Brașov, the pinger's
        # known nightly gap. Four deep calls a day wake the database four times.
        if: always()
        env:
          BASE_URL: ${{ secrets[matrix.base_url_secret] }}
        run: |
          if [ -z "$BASE_URL" ]; then
            exit 0
          fi
          node scripts/backstop-verdict.mjs --name "${{ matrix.name }}" --file "$RUNNER_TEMP/health.json"
