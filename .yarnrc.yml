# Yarn 4 configuration. Mirrors the conventions of the owner's other project so the two
# repositories behave the same way; DECISIONS.md §22 records why.

# Keep a real node_modules tree. Plug'n'Play is not worth the tooling friction here, and
# Vercel's build image expects node_modules.
nodeLinker: node-modules

# Pin dependencies exactly (no ^ or ~) when adding or upgrading. AGENTS.md §1.2 requires a
# verified version rather than a range that drifts on the next install.
defaultSemverRangePrefix: ''

# No git dependencies exist. An empty list means one added later must be approved
# deliberately rather than silently.
approvedGitRepositories: []

# Yarn 4.18 can gate newly published versions by age as a supply-chain measure. 0 keeps the
# previous behaviour, which exact pins plus `--immutable` in CI already rely on. Raising it is
# a deliberate security decision, not a default to drift into.
npmMinimalAgeGate: 0

# Package build scripts run. Stated rather than inherited from a default.
enableScripts: true
